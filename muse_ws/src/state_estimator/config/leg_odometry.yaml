leg_odometry_plugin:
  plugin: "LegOdometryPlugin"
  robot_type: "a2"
  # urdf_path: "$(find state_estimator)/urdfs/anymal.urdf"
  urdf_path: "$(find state_estimator)/urdfs/a2.urdf"

  low_state_topic: "/lowstate"   # Unitree LowState topic
  attitude_topic: "/muse/attitude"
  pub_topic: "muse/leg_odometry"

  grf_threshold: 30.0
  grf_threshold_low: 0.0
  grf_threshold_high: 30.0
  use_grf_hysteresis: false
  contact_normal: [0.0, 0.0, 1.0]
  use_force_norm: false
  # Contact is compressive only. Keeping the sign exposes force-sign mistakes.
  use_absolute_normal_force: false
  force_sign: -1.0
  use_inverse_dynamics_compensation: true
  # A2 ddq must be validated before enabling it in inverse dynamics.
  use_joint_acceleration: false
  # EMA: filtered = previous + alpha * (sample - previous).
  grf_input_filter_alpha: 0.20
  grf_force_filter_alpha: 0.20
  grf_solve_damping: 1.0e-4
  grf_min_singular_value: 1.0e-6
  grf_max_condition_number: 1.0e4

  # Model order is FL/FR/RL/RR; A2 DDS order is FR/FL/RR/RL.
  motor_joint_names:
    - "FL_hip_joint"
    - "FL_thigh_joint"
    - "FL_calf_joint"
    - "FR_hip_joint"
    - "FR_thigh_joint"
    - "FR_calf_joint"
    - "RL_hip_joint"
    - "RL_thigh_joint"
    - "RL_calf_joint"
    - "RR_hip_joint"
    - "RR_thigh_joint"
    - "RR_calf_joint"

  motor_indices:
    - 3
    - 4
    - 5
    - 0
    - 1
    - 2
    - 9
    - 10
    - 11
    - 6
    - 7
    - 8

  # Foot frame names in the URDF, in FL/FR/RL/RR order
  feet_frame_names:
    - "FL_foot"
    - "FR_foot"
    - "RL_foot"
    - "RR_foot"
